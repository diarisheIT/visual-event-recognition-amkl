[project]
name = "ver"
version = "0.1.0"
description = "From-scratch reproduction of Duan et al., Visual Event Recognition in Videos by Learning from Web Data (TPAMI 2012)"
authors = [
    { name = "diarisheIT", email = "198357684+diarisheIT@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
